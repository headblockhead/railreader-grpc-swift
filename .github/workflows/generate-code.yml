name: Generate code

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  generate-code:
    runs-on: macos-latest
    steps:  
      - name: Install protoc
        run: |
          brew install protobuf
      - name: Install Swift protoc plugins
        run: |
          brew install swift-protobuf
          brew install protoc-gen-grpc-swift
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Generate, commit, and push
        run: |
          ./gen.sh
          git config user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -N .
          git diff --exit-code || (git commit -am "autoregenerate code from railreader-grpc submodule" && git push)
